name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Python ${{ matrix.python-version }} (ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest
          pip install -e .

      - name: Run test suite
        run: pytest tests/ -q

      - name: Run CLI smoke-test demo
        run: conformal-ivim demo

      - name: Verify wheel and sdist builds
        run: |
          python -m build
          ls -lh dist/
          test -n "$(ls dist/*.whl)"
          test -n "$(ls dist/*.tar.gz)"
          python -m zipfile -l dist/*.whl | grep "conformal_ivim/py.typed"
